<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Local Media Archiver</title>
  </head>
  <body>
    <main>
      <h1>Save media</h1>
      <p>Instagram · Threads · LinkedIn · Reddit</p>
      <button id="save-eagle" type="button">Save to Eagle</button>
      <button id="save-downloads" type="button" class="secondary">Save to Downloads</button>
      <label class="lucky-option">
        <input id="i-feel-lucky" type="checkbox">
        <span><strong>I feel lucky</strong><br>Try the current site</span>
      </label>
      <output id="status" aria-live="polite"></output>
      <small>Data and cookies are not sent to external servers.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
